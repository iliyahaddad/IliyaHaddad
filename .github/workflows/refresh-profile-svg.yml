name: Refresh GitHub profile SVG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *' # Daily at 05:17 UTC

permissions:
  contents: write

concurrency:
  group: refresh-profile-svg
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh native SVG using public GitHub API (no token)
        run: python .github/scripts/update_profile_svg.py

      - name: Commit refreshed SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matrix-github-profile.svg
          git diff --cached --quiet || (
            git commit -m "chore: refresh native GitHub profile SVG"
            git push
          )
